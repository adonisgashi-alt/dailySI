name: Daily risk reading

on:
  schedule:
    - cron: "7 0 * * *" # 00:07 UTC, just after the daily cut
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-risk

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/daily-risk.ts
      - name: Commit reading
        run: |
          if git diff --quiet data/risk-history.json; then echo "No change"; exit 0; fi
          git config user.name "daily-si-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/risk-history.json
          git commit -m "Daily risk reading $(date -u +%F)"
          git push
