name: Probe GitHub Models

# Manual check that the free GitHub Models API answers from this repo.
on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types scripts/models-probe.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
