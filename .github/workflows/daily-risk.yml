name: Daily risk reading

# Records the day's AI Replacing Humans and AI Extinction Risk readings in
# data/risk-history.json. The site reads it straight from the repo.
on:
  schedule:
    - cron: "7 0 * * *" # 00:07 UTC, just after the daily cut
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/daily-risk.ts
      - name: Commit reading
        run: |
          if git diff --quiet data/risk-history.json; then echo "No change"; exit 0; fi
          git config user.name "daily-si-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/risk-history.json
          git commit -m "Daily risk reading $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
