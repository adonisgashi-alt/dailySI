name: Archive stories

# Files every confirmed story into data/archive so story pages live forever.
# The site reads the archive straight from the repo; vercel.json skips
# rebuilding the site for data-only commits.
on:
  schedule:
    - cron: "11,41 * * * *" # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/archive.ts
      - name: Commit archive
        run: |
          git add data/archive
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git config user.name "daily-si-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive $(date -u +'%F %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
